<div class="admin-shell">
  <aside class="admin-sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand">
      <div class="brand-mark">UBS</div>
      <span>Admin Panel</span>
    </div>

    <ng-content select="[sidebar-content]"></ng-content>
  </aside>

  <div class="sidebar-scrim" *ngIf="sidebarOpen" (click)="toggleSidebar.emit()"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="burger-btn" type="button" (click)="toggleSidebar.emit()" aria-label="Toggle menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1>{{ title }}</h1>
      </div>

      <div class="topbar-actions">
        <button class="topbar-logout" type="button" (click)="logout.emit()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Log out</span>
        </button>
      </div>
    </header>

    <main class="admin-content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
