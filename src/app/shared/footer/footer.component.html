<footer class="site-footer">
  <div class="wrap footer-top">
    <a routerLink="/" class="footer-brand">
      <img src="../../assets/img/ubs-logo.png" alt="UBS Logo" class="footer-logo" />
      <span class="footer-brand-text">Union Biblical<br />Seminary</span>
    </a>

    <form class="footer-newsletter" (ngSubmit)="subscribeNewsletter()" *ngIf="!newsletterSubmitted">
      <input type="text" name="newsletterName" placeholder="First Name" [(ngModel)]="newsletterName" required />
      <input type="email" name="newsletterEmail" placeholder="Enter your email to join" [(ngModel)]="newsletterEmail"
        required />
      <button type="submit">Yes, Please <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <p class="footer-newsletter-success" *ngIf="newsletterSubmitted">Thanks for joining — check your inbox!</p>
  </div>

  <div class="wrap footer-divider"></div>

  <div class="wrap footer-bottom">
    <div class="footer-social">
      <span>Follow Us</span>
      <a *ngFor="let s of socialLinks" [href]="s.url" target="_blank" rel="noopener" [attr.aria-label]="s.label">
        <i [class]="s.icon"></i>
      </a>
    </div>

    <div class="footer-legal-links">
      <a routerLink="/privacy-policy">Privacy Policy</a>
      <a routerLink="/terms-of-use">Terms Of Use</a>
    </div>

    <p class="footer-copyright">Copyright © {{ currentYear }} Union Biblical Seminary. All Rights Reserved.</p>
  </div>
</footer>
