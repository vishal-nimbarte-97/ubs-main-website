  <nav class="wrap main-nav">
    <a routerLink="/" class="logo-wrapper me-auto" (click)="closeMobileMenu()">
      <img src="assets/img/ubs-logo.png" alt="UBS Logo" class="logo-img" />
      <div class="logo-text">
        <span class="logo-name">union biblical seminary</span>
        <span class="logo-tagline">Speaking the Truth in Love</span>
      </div>
    </a>

    <ul id="primary-nav-links" class="nav-links" [class.open]="mobileMenuOpen" [attr.aria-hidden]="!mobileMenuOpen">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()">Home</a></li>
      <li class="nav-dropdown" [class.open]="openDropdown === 'about'" (mouseenter)="openDropdownMenu('about')"
        (mouseleave)="closeDropdownMenu('about')" (focusin)="openDropdownMenu('about')">
        <button type="button" class="nav-dropdown-trigger" aria-haspopup="true"
          [attr.aria-expanded]="openDropdown === 'about'" (click)="openDropdownMenu('about')">About Us</button>
        <ul class="subnav" aria-label="About Us submenu">
          <li><a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a></li>
          <li><a routerLink="/history" routerLinkActive="active" (click)="closeMobileMenu()">Our History</a></li>
        </ul>
      </li>
      <li><a routerLink="/campus" routerLinkActive="active" (click)="closeMobileMenu()">Campus</a></li>
      <li class="nav-dropdown" [class.open]="openDropdown === 'administration'"
        (mouseenter)="openDropdownMenu('administration')" (mouseleave)="closeDropdownMenu('administration')"
        (focusin)="openDropdownMenu('administration')">
        <button type="button" class="nav-dropdown-trigger" aria-haspopup="true"
          [attr.aria-expanded]="openDropdown === 'administration'"
          (click)="openDropdownMenu('administration')">Administration</button>
        <ul class="subnav" aria-label="Administration submenu">
          <li><a routerLink="/faculty" routerLinkActive="active" (click)="closeMobileMenu()">Faculty</a></li>
        </ul>
      </li>
      <li><a routerLink="/library" routerLinkActive="active" (click)="closeMobileMenu()">Library</a></li>
      <li class="nav-dropdown" [class.open]="openDropdown === 'academics'"
        (mouseenter)="openDropdownMenu('academics')" (mouseleave)="closeDropdownMenu('academics')"
        (focusin)="openDropdownMenu('academics')">
        <button type="button" class="nav-dropdown-trigger" aria-haspopup="true"
          [attr.aria-expanded]="openDropdown === 'academics'"
          (click)="openDropdownMenu('academics')">Academics</button>
        <ul class="subnav" aria-label="Academics submenu">
          <li><a routerLink="/apply" routerLinkActive="active" (click)="closeMobileMenu()">Apply</a></li>
          <li><a routerLink="/tuition" routerLinkActive="active" (click)="closeMobileMenu()">Tuition</a></li>
          <li><a routerLink="/programmes/residential" routerLinkActive="active" (click)="closeMobileMenu()">Residential Programmes</a></li>
          <li><a routerLink="/programmes/non-residential" routerLinkActive="active" (click)="closeMobileMenu()">Non-Residential Programmes</a></li>
          <li><a routerLink="/faq" routerLinkActive="active" (click)="closeMobileMenu()">FAQ</a></li>
        </ul>
      </li>
      <li><a routerLink="/student-zone" routerLinkActive="active" (click)="closeMobileMenu()">Student Zone</a></li>
      <li><a routerLink="/gallery" routerLinkActive="active" (click)="closeMobileMenu()">Gallery</a>
      </li>
    </ul>

    <button id="mobile-menu-toggle" class="burger" [class.open]="mobileMenuOpen" (click)="toggleMobileMenu()"
      [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'" [attr.aria-expanded]="mobileMenuOpen"
      aria-controls="primary-nav-links">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Backdrop: click outside the open mobile menu to close it -->
  <div class="nav-backdrop" [class.open]="mobileMenuOpen" (click)="closeMobileMenu()" aria-hidden="true"></div>
</header>
