<ng-container *ngIf="!isAdminRoute; else adminPortal">
  <app-header></app-header>

  <main class="page-content" [class.is-home]="isHome">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</ng-container>

<ng-template #adminPortal>
  <router-outlet></router-outlet>
</ng-template>

<div
  *ngIf="isAdminDashboardRoute && (loadingVisible$ | async)"
  class="admin-skeleton"
  role="status"
  aria-live="polite"
  aria-label="Loading dashboard"
>
  <aside class="admin-skeleton__sidebar" aria-hidden="true">
    <div class="admin-skeleton__brand"></div>
    <div class="admin-skeleton__nav">
      <span *ngFor="let item of [1, 2, 3, 4, 5, 6, 7]"></span>
    </div>
  </aside>

  <section class="admin-skeleton__main" aria-hidden="true">
    <header class="admin-skeleton__topbar">
      <div>
        <span class="admin-skeleton__eyebrow"></span>
        <span class="admin-skeleton__title"></span>
      </div>
      <span class="admin-skeleton__logout"></span>
    </header>

    <main class="admin-skeleton__content">
      <div class="admin-skeleton__intro"></div>
      <div class="admin-skeleton__form">
        <span class="admin-skeleton__section-title"></span>
        <div class="admin-skeleton__fields">
          <span *ngFor="let field of [1, 2, 3, 4]"></span>
        </div>
        <span class="admin-skeleton__button"></span>
      </div>
      <div class="admin-skeleton__list">
        <span class="admin-skeleton__section-title"></span>
        <span *ngFor="let row of [1, 2, 3]"></span>
      </div>
    </main>
  </section>

  <span class="admin-skeleton__sr-only">Loading dashboard</span>
</div>
