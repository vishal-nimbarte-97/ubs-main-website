<main class="publications-page">
  <section class="publications-hero">
    <div class="academic-container">
      <span class="eyebrow">Academics</span>
      <h1>Publications</h1>
      <p>
        A space for future theological writing, research reflections, and
        ministry-oriented publications from UBS.
      </p>
    </div>
  </section>

  <section class="publications-section">
    <div class="academic-container">
      <div class="publication-grid">
        <article class="publication-card" *ngFor="let item of publications">
          <div class="publication-visual">
            <img
              *ngIf="item.coverImageUrl; else publicationPlaceholder"
              class="publication-cover"
              [src]="item.coverImageUrl"
              [alt]="item.title + ' cover'"
              (error)="onCoverImageError(item)"
            />
            <ng-template #publicationPlaceholder>
              <div class="publication-icon">P</div>
            </ng-template>
            <span class="publication-badge">{{ item.status }}</span>
          </div>

          <div class="publication-content">
            <span class="publication-tag">To be announced</span>
            <h2>{{ item.title }}</h2>
            <p>{{ item.description }}</p>
            <ng-container *ngIf="item.pdfPath; else publicationLink">
              <button
                type="button"
                class="publication-button"
                (click)="openPublicationPdf(item)"
              >
                Show More Details
              </button>
            </ng-container>
            <ng-template #publicationLink>
              <a
                *ngIf="item.link; else publicationComingSoon"
                class="publication-button"
                [href]="item.link"
                target="_blank"
                rel="noopener noreferrer"
              >Show More Details</a>
            </ng-template>
            <ng-template #publicationComingSoon>
              <button type="button" class="publication-button" disabled>Coming soon</button>
            </ng-template>
          </div>
        </article>
      </div>
    </div>
  </section>

  <div
    *ngIf="selectedPublication && selectedPdfUrl"
    class="publication-pdf-overlay"
    role="presentation"
    (click)="closePublicationPdf()"
  >
    <section
      class="publication-pdf-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'PDF for ' + selectedPublication.title"
      (click)="$event.stopPropagation()"
    >
      <header class="publication-pdf-header">
        <h2>{{ selectedPublication.title }}</h2>
        <button type="button" class="publication-pdf-close" (click)="closePublicationPdf()" aria-label="Close PDF viewer">
          &times;
        </button>
      </header>
      <iframe
        class="publication-pdf-frame"
        [src]="selectedPdfUrl"
        [title]="'PDF viewer for ' + selectedPublication.title"
      ></iframe>
    </section>
  </div>
</main>
